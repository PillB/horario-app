title = "Horario App — gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{93}'''
tags = ["anthropic", "ai", "secret"]

[[rules]]
id = "supabase-service-role-key"
description = "Supabase Service Role Key"
regex = '''sb_secret_[A-Za-z0-9_-]+'''
tags = ["supabase", "secret"]

[[rules]]
id = "clerk-secret-key"
description = "Clerk Secret Key"
regex = '''sk_(test|live)_[A-Za-z0-9]+'''
tags = ["clerk", "secret"]

[[rules]]
id = "supabase-publishable-key"
description = "Supabase Publishable (Anon) Key"
regex = '''sb_publishable_[A-Za-z0-9_-]+'''
tags = ["supabase", "anon", "publishable"]

[allowlist]
description = "Global allowlist for template files, generated artifacts, and placeholder values"
paths = [
  '''^\.env\.example$''',
  '''^\.env\.local\.template$''',
  '''^scripts/.*\.json$''',
  '''^node_modules/''',
  '''^dist/''',
  '''^\.(expo)/''',
  '''^web-build/''',
  '''^playwright-report/''',
  '''^test-results/'''
]
regexes = [
  '''FILL_ME_IN''',
  '''YOUR_KEY_HERE'''
]